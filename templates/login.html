<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaniControl - Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- Pembungkus Utama (Posisi di Tengah Layar) -->
    <div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center">
        <div class="row w-100 justify-content-center">
            <div class="col-md-4 col-sm-8">
                
                <!-- Kotak Form Login -->
                <div class="card shadow border-0 p-4">
                    <div class="text-center mb-4">
                        <h4 class="fw-bold text-success">
                            <i class="bi bi-tree-fill"></i> TaniControl
                        </h4>
                        <p class="text-muted small">Silakan Login</p>
                    </div>

                   <!-- Form Login dengan Notifikasi Flash Error -->
<form method="POST">

    <!-- KOTAK NOTIFIKASI ERROR (Hanya 1 blok ini saja di dalam form) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-danger alert-dismissible fade show text-center py-2 mb-3" role="alert" style="font-size: 14px;">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    {{ message }}
                    <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" name="username" placeholder="Masukkan username" required>
    </div>
    
    <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
            <input type="password" class="form-control" id="passwordInput" name="password" placeholder="Masukkan password" required>
            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                <i class="bi bi-eye-slash" id="toggleIcon"></i>
            </button>
        </div>
    </div>

    <div class="d-grid gap-2 mt-4">
        <button type="submit" class="btn btn-success">Login</button>
    </div>
</form>

                    <div class="text-center mt-3">
                        <small class="text-muted" style="font-size: 11px;">
                            Welcome to TaniControl @BerlindoCustomSystem<br>
                            Pastikan Nama Pengguna & Password Valid
                        </small>
                    </div>
                </div>

            </div>
        </div>
    </div>

    
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- JavaScript Toggle Password -->
<script>
document.addEventListener('DOMContentLoaded', function () {

    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('passwordInput');
    const toggleIcon = document.getElementById('toggleIcon');

    togglePassword.addEventListener('click', function () {

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';

            toggleIcon.classList.remove('bi-eye-slash');
            toggleIcon.classList.add('bi-eye');

        } else {
            passwordInput.type = 'password';

            toggleIcon.classList.remove('bi-eye');
            toggleIcon.classList.add('bi-eye-slash');
        }

    });

});
</script>

</body>
</html>
